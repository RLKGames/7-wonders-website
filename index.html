<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Wonders - Homepage</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<!-- Header -->
<div id="header"></div>

<!-- Content -->
<div class="container">
<main>
<h2>Welcome to the website for the 7 Wonders of the World!</h2>
<p>I'm aware this website is called 7 wonders but it has 8. I didn't notice that when I was making this in college so that's just a thing now.</p>
</main>
</div>

<!-- Footer -->
<div id="footer"></div>


<script>
<!-- Fetch header.html -->
fetch('header.html')
    .then(response => response.text())
    .then(data => document.getElementById('header').innerHTML = data);

<!-- Fetch footer.html -->
fetch('footer.html')
    .then(response => response.text())
    .then(data => document.getElementById('footer').innerHTML = data);
</script>

</body>
</html>
